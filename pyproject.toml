[project]
name = "calendar-mcp-gateway"
version = "0.1.0"
description = "A safe capability gateway for calendar operations (Google Calendar integration)."
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]